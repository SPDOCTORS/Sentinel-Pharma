[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# The existing .pytest_cache can be non-writable on Windows after prior
# elevated runs. Keep runner state in a separate ignored local directory.
cache_dir = .pytest_cache_local
addopts = -v --tb=short --cov=app --cov-report=term-missing
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
